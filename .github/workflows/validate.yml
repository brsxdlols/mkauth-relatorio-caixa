name: Validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.3', '8.0', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
      - name: Validate addon and safe installer
        run: sh scripts/validate.sh

      - name: Validate cash filters and report rendering
        run: |
          node tests/finance_filters.cjs
          node tests/relatorio_print.cjs
          node tests/pdf_download.cjs
